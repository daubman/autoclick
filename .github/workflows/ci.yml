name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Test
        run: swift test
      - name: Build app
        run: scripts/build-app.sh
      - uses: actions/upload-artifact@v4
        with:
          name: Autoclick
          path: build/Autoclick.zip
