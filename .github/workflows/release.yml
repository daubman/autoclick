name: Release

# Push a tag like v1.0.0 to publish a release with Autoclick.zip attached.
# The README links to releases/latest/download/Autoclick.zip, which always points at the newest one.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Test
        run: swift test
      - name: Build app
        run: scripts/build-app.sh "${GITHUB_REF_NAME#v}"
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" build/Autoclick.zip \
            --title "Autoclick $GITHUB_REF_NAME" --generate-notes
